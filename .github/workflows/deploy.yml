name: Deploy

on:
  push:
    branches: [main]

# No staging environment (see README "Deployment") — this pipeline is the
# safety net, so it fails fast on type errors/tests before touching D1 or
# deploying, and branch protection on main should require it to pass.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      # Real wrangler.toml is gitignored (no committed D1 database_id — see
      # #16 / #10 issue discussion). Regenerate it here the same way
      # scripts/bootstrap.sh does locally, from a repo secret.
      - name: Generate wrangler.toml
        run: envsubst < wrangler.toml.example > wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply rummikub-scores-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
