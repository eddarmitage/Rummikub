name: Deploy

on:
  push:
    branches: [main]

# No staging environment (see README "Deployment") — branch protection
# requiring the CI workflow (ci.yml) to pass is the safety net, so this
# trusts that whatever lands on main already passed type-check/tests/e2e.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Real wrangler.toml is gitignored (no committed D1 database_id — see
      # #16 / #10 issue discussion). Regenerate it here the same way
      # scripts/bootstrap.sh does locally, from a repo secret.
      - name: Generate wrangler.toml
        run: envsubst < wrangler.toml.example > wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply rummikub-scores-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
