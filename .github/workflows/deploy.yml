name: Deploy

on:
  push:
    branches: [main]

# No staging environment (see README "Deployment") — branch protection
# requiring the CI workflow (ci.yml) to pass is the safety net, so this
# trusts that whatever lands on main already passed type-check/tests/e2e.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Real wrangler.toml is gitignored (no committed D1 database_id — see
      # #16 / #10 issue discussion). Regenerate it here the same way
      # scripts/bootstrap.sh does locally, from a repo secret.
      #
      # CUSTOM_DOMAIN is optional (see README "Deployment") — when unset, no
      # [[routes]] block is added and the Worker deploys to *.workers.dev
      # exactly as before.
      - name: Generate wrangler.toml
        run: |
          envsubst < wrangler.toml.example > wrangler.toml
          if [ -n "$CUSTOM_DOMAIN" ]; then
            cat <<EOF >> wrangler.toml

          [[routes]]
          pattern = "$CUSTOM_DOMAIN"
          custom_domain = true
          EOF
          fi
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply rummikub-scores-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
