name: CI

on:
  push:
    branches: [main]
  pull_request:

# The check branch protection on main should require — see README "Deployment".
# Deploying is a separate workflow (deploy.yml) that only runs after a push
# lands on main, trusting that this already passed on the PR.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
