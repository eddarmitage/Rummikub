# Wrangler config for the integration-layer cucumber-js step definitions
# (tests/cucumber/integration/). cucumber-js isn't a Vitest plugin, so unlike
# tests/integration/ (vitest-pool-workers, real workerd in-process) this layer
# talks to a real, standalone `wrangler dev` over HTTP instead — see
# tests/cucumber/integration/hooks.ts. Own port + own database id so its local
# D1 state never mixes with wrangler.test.toml or wrangler.e2e.toml's.
name = "rummikub-scores-cucumber-integration"
main = "src/worker/index.ts"
compatibility_date = "2026-08-19"

[vars]
# Lets requireAuth() accept the X-Dev-User-Email header — see README "Auth setup".
DEV_AUTH_BYPASS_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "rummikub-scores-cucumber-integration-db"
database_id = "11111111-1111-1111-1111-111111111111"
migrations_dir = "migrations"
