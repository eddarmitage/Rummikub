# Wrangler config for integration tests (tests/integration/), consumed by
# @cloudflare/vitest-pool-workers via vitest.integration.config.ts. Unlike the
# real wrangler.toml (gitignored, generated by scripts/bootstrap.sh from
# wrangler.toml.example against a live Cloudflare account), this file is
# committed and self-contained: the pool runs entirely against a local,
# in-memory D1 instance via Miniflare, so the database_id below never needs to
# resolve against a real account.
name = "rummikub-scores-test"
main = "src/worker/index.ts"
compatibility_date = "2026-08-19"

[vars]
# Lets requireAuth() accept the X-Dev-User-Email header instead of a live
# Cloudflare Access session — see README "Auth setup".
DEV_AUTH_BYPASS_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "rummikub-scores-test-db"
database_id = "00000000-0000-0000-0000-000000000000"
