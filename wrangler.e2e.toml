# Wrangler config for Playwright e2e tests (tests/e2e/), used to run
# `wrangler dev` against a throwaway, fully-local D1 instance. Unlike the real
# wrangler.toml (gitignored, generated by scripts/bootstrap.sh against a live
# Cloudflare account), this file is committed and self-contained — no
# `wrangler login` or real D1 database needed, so e2e can run in any sandbox.
# Mirrors wrangler.toml.example, minus the real D1 database ID.
name = "rummikub-scores-e2e"
main = "src/worker/index.ts"
compatibility_date = "2026-08-19"

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# Lets requireAuth() accept the X-Dev-User-Email header instead of a live
# Cloudflare Access session — see README "Auth setup". Unused by the current
# smoke test (no write routes exercised yet) but kept so e2e can grow into
# authenticated flows without reaching for a real Access session.
DEV_AUTH_BYPASS_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "rummikub-scores-e2e-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
